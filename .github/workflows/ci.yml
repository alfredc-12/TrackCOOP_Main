name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"
      NEXT_PUBLIC_API_URL: "http://localhost:5000"
      FRONTEND_URL: "http://localhost:3000"
      CORS_ALLOWED_ORIGINS: "http://localhost:3000"
      DB_HOST: "127.0.0.1"
      DB_PORT: "3306"
      DB_NAME: "trackcoop_ci"
      DB_USER: "trackcoop_ci"
      DB_SSL: "false"
      STORAGE_DRIVER: "local"
      LOCAL_STORAGE_ROOT: "storage/uploads"
      PAYMONGO_ENABLED: "false"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: API tests
        run: npm run test:api

      - name: PayMongo and core tests
        run: npm run test:paymongo-core

      - name: Records tests
        run: npm run test:records

      - name: Secret scan
        run: npm run security:scan

      - name: Build
        run: npm run build
