name: Verify Verpex SSH connection

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/verpex-ssh-check.yml

permissions:
  contents: read

jobs:
  verify-ssh:
    name: Verify host key and test read-only SSH login
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Validate Verpex server identity
        shell: bash
        env:
          VERPEX_HOST: ${{ secrets.VERPEX_SSH_HOST }}
        run: |
          set -euo pipefail
          test -n "$VERPEX_HOST"
          ssh-keyscan -T 10 -p 22 -t ed25519 "$VERPEX_HOST" 2>/dev/null > "$RUNNER_TEMP/verpex-known-hosts"
          test -s "$RUNNER_TEMP/verpex-known-hosts"
          actual=$(ssh-keygen -lf "$RUNNER_TEMP/verpex-known-hosts" -E sha256 | awk '$4=="(ED25519)" { print $2 }' | head -n 1)
          expected="SHA256:fGMfvrvS+yTnR34uJmdcCotSizD8wO74DSs9IGyPUqQ"
          if [ "$actual" != "$expected" ]; then
            echo "::error::Verpex SSH server host key does not match the verified fingerprint."
            exit 1
          fi
          echo "Verified Verpex SSH host fingerprint."

      - name: Authenticate with passwordless deployment key (read-only)
        shell: bash
        env:
          VERPEX_HOST: ${{ secrets.VERPEX_SSH_HOST }}
          VERPEX_USER: ${{ secrets.VERPEX_SSH_USER }}
          VERPEX_KEY: ${{ secrets.VERPEX_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$VERPEX_HOST"
          test -n "$VERPEX_USER"
          test -n "$VERPEX_KEY"
          mkdir -p "$RUNNER_TEMP/verpex-ssh"
          chmod 700 "$RUNNER_TEMP/verpex-ssh"
          printf '%s\n' "$VERPEX_KEY" > "$RUNNER_TEMP/verpex-ssh/deploy_key"
          chmod 600 "$RUNNER_TEMP/verpex-ssh/deploy_key"
          # Validate key format without printing the public key.
          ssh-keygen -y -P '' -f "$RUNNER_TEMP/verpex-ssh/deploy_key" > /dev/null
          timeout 30s ssh -n -p 22 \
            -i "$RUNNER_TEMP/verpex-ssh/deploy_key" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o PasswordAuthentication=no \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/verpex-known-hosts" \
            -o ConnectTimeout=15 \
            "$VERPEX_USER@$VERPEX_HOST" \
            'set -eu
             echo "SSH authentication succeeded"
             test -d "$HOME/trackcoop-web" && echo "Frontend directory exists"
             if [ -L "$HOME/trackcoop-web/node_modules" ]; then echo "node_modules is symlink"; elif [ -d "$HOME/trackcoop-web/node_modules" ]; then echo "node_modules is directory"; else echo "node_modules absent"; fi
             if [ -f "$HOME/trackcoop-web/server.js" ]; then echo "server.js exists"; else echo "server.js absent"; fi
             if [ -f "$HOME/trackcoop-web/package.json" ]; then echo "package.json exists"; else echo "package.json absent"; fi
             if [ -d "$HOME/trackcoop-web/.next" ]; then echo "next build exists"; else echo "next build absent"; fi
             if [ -x "$HOME/nodevenv/trackcoop-web/24/bin/node" ]; then echo "Node.js 24 environment exists"; else echo "Node.js 24 environment absent"; fi
             if [ -d "$HOME/trackcoop-web/tmp" ]; then echo "tmp directory exists"; else echo "tmp directory absent"; fi'
